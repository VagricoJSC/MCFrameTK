
[database]
product = 【DB_PRODUCT】
user = 【DB_USER】
pw = 【DB_PASS】
host = 【DB_HOST】
port = 【DB_PORT】
sid = 【DB_SVC】
dbname = 【DB_DBNAME】
schema = 【DB_SCHEMA】

oracleurl = jdbc:oracle:thin:@//${database.host}:${database.port}/${database.sid}
postgresurl = jdbc:postgresql://${database.host}:${database.port}/${database.dbname}?currentSchema=${database.schema}

[cors]
Origin=*
Methods=POST,GET,OPTIONS
Headers=X-ATWORK-USER,Content-Type,Authorization,X-ATWORK-LOCALE


[fileupload]
dir = ${HOME}\upload

[userinit]
dir = ${HOME}\userinit

[mcframe]
awservlet=http://【MCF7_HOST】:【MCF7_PORT】/【MCF7_CONTEXT】/MCAWServlet

