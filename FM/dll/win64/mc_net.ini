[mc_net]
# version
MCVERSION=MCFRAME_7_0_2

# log file
LOG_FILE_NAME=mc_net.log
LOG_FILE_SIZE=512				// KBytes

# message file
MSG_FILE_NAME=err_msg.dat

# dialog setting when communication error/problem has occured
WINDOWS_MODE=NO
ERR_HNDL_WINDOWS_MODE=1

# receive buffer size (KBytes)
RES_BUF_SIZE=100

# maximum number of simultaneous connections in a client
MAX_CONNECTION=10

# Whether to output log contents to standard error(if not to output, set NO/0/blank)
LOG_STDERR_OUT=NO

# interval when receiving(milliseconds)
READ_INTERVAL=0

# character string to check mcframe message
MCDP_CHK_STR=<HEADER>;

