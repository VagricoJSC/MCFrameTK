# =======================================================================
# MCFrame.0 バッチ処理定数定義 [PL/SQL,その他IFプログラム用]
# -----------------------------------------------------------------------
#    Windowsの形式と同様にセクションを記述していますが
#    セクションを含まずとも同一のキーが生じないように注意ください
# =======================================================================

# =======================================================================
# 共通定数の定義
# -----------------------------------------------------------------------
# サーバ環境（DBサーバ）のログ出力             [LOG]
#   ログ出力先のルートフォルダ                 ComLogDir
#     (フォルダパスは"/"で区切ること)
#   ログ出力レベル [ E/W/I/D ]                 ComLogLev
#   終了コードしきい値                         ErrBorder
#     設定値未満：正常終了
#     設定値以上：警告終了
#   ログ出力先フラグ:ファイル出力              LogOutF
#   ログ出力先フラグ:テーブル出力              LogOutT
#     [ TRUE:出力する/FALSE('TRUE'or'true'以外):出力しない ]
#
# =======================================================================
[LOG]
ComLogDir=/export/home/oracle
ComLogLev=I
ErrBorder=1
LogOutF=TRUE
LogOutT=TRUE


