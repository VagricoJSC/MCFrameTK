#!/usr/bin/sh -f
############################################################################
#
#  MCFrame ReleaseManager V 6.2.0.0 リリース環境プロパティ
#
#    注意事項
#    ・本ファイル内の設定は、本ファイル内の別の設定にプレースホルダーとして
#      設定することができます。
#    ・プレースホルダーを使用する場合は以下のいずれかの書式で記述します。
#        %...%
#        ${...}
#      ※OSには依存しません
#
############################################################################

#===========================================================================
#  アプリケーション設定
#===========================================================================
#---------------------------------------------------------------------------
#  APP_NAME
#    アプリケーション名（半角英数）
#---------------------------------------------------------------------------
APP_NAME=


#---------------------------------------------------------------------------
#  APP_VERSION
#    アプリケーションバージョン（半角英数）
#---------------------------------------------------------------------------
APP_VERSION=


#---------------------------------------------------------------------------
#  APP_BUILD
#    アプリケーションビルドバージョン（半角英数）
#
#    自動設定にする場合は設定しないでください。
#---------------------------------------------------------------------------
#APP_BUILD=


#---------------------------------------------------------------------------
#  APP_VENDOR
#    会社名（半角英数）
#---------------------------------------------------------------------------
APP_VENDOR=


#---------------------------------------------------------------------------
#  APP_MAIN
#    アプリケーションのバージョンを表すモジュールID
#---------------------------------------------------------------------------
APP_MAIN=


#---------------------------------------------------------------------------
#  APP_PJID（必須）
#    アプリケーションのプロジェクトID
#---------------------------------------------------------------------------
APP_PJID=


#---------------------------------------------------------------------------
#  SYSTEM_ID（必須）
#    システムID
#---------------------------------------------------------------------------
SYSTEM_ID=




#===========================================================================
#  インストールイメージ設定
#===========================================================================
#---------------------------------------------------------------------------
#  SETUP_HOME（必須）
#    インストールイメージホームディレクトリ
#---------------------------------------------------------------------------
SETUP_HOME=


#---------------------------------------------------------------------------
#  FM_HOME（必須）
#    FrameManager インストールディレクトリ
#---------------------------------------------------------------------------
FM_HOME=%SETUP_HOME%\FrameManager


#---------------------------------------------------------------------------
#  JRE_DL
#    JREダウンロード
#
#    JREをクライアントにダウンロードさせる場合 true を設定してください。
#    ダウンロードしない場合はキーを削除またはコメントアウトしてください。
#---------------------------------------------------------------------------
JRE_DL=true




#===========================================================================
#  ビルド設定
#===========================================================================
#---------------------------------------------------------------------------
#  BUILD_HOME（必須）
#    ビルドホームディレクトリ
#---------------------------------------------------------------------------
BUILD_HOME=%FM_HOME%\relmgr


#---------------------------------------------------------------------------
#  BUILD_LOG（必須）
#    ビルドログ出力ディレクトリ
#---------------------------------------------------------------------------
BUILD_LOG=%BUILD_HOME%\log


#---------------------------------------------------------------------------
#  BUILD_TEMP（必須）
#    ビルド作業ディレクトリ
#---------------------------------------------------------------------------
BUILD_TEMP=%BUILD_HOME%\temp


#---------------------------------------------------------------------------
#  BUILD_SOURCE（必須）
#    ビルド対象ソース格納ディレクトリ
#---------------------------------------------------------------------------
BUILD_SOURCE=%BUILD_HOME%\src


#---------------------------------------------------------------------------
#  BUILD_RELEASE（必須）
#    リリース対象ファイル格納ディレクトリ
#---------------------------------------------------------------------------
BUILD_RELEASE=%BUILD_HOME%\release


#---------------------------------------------------------------------------
#  BUILD_APPLIB（必須）
#    ビルドに必要なライブラリ格納ディレクトリ
#
#    指定したディレクトリのサブディレクトリにcommon、server、clientが必要
#    です。
#---------------------------------------------------------------------------
BUILD_APPLIB=%BUILD_HOME%\lib


#---------------------------------------------------------------------------
#  BUILD_LIB（必須）
#    ビルドで使用するライブラリ格納ディレクトリ
#---------------------------------------------------------------------------
BUILD_LIB=%BUILD_HOME%\antlib


#---------------------------------------------------------------------------
#  BUILD_ENCODE（必須）
#    Javaソースファイルのエンコード
#---------------------------------------------------------------------------
BUILD_ENCODE=UTF-8


#---------------------------------------------------------------------------
#  BUILD_JARSUFFIX
#    JARファイルの接尾辞
#---------------------------------------------------------------------------
BUILD_JARSUFFIX=


#---------------------------------------------------------------------------
#  BUILD_JAVADOC
#    JavaDoc生成
#
#    JavaDocを生成する場合 true を設定してください。
#    省略時は false とみなされます。
#---------------------------------------------------------------------------
BUILD_JAVADOC=


#---------------------------------------------------------------------------
#  BUILD_JAVADOC_HEAP
#    JavaDoc生成時に使用する最大メモリサイズ
#
#    JavaDoc生成時にメモリ不足でエラーになる場合に適切なサイズを指定してくだ
#    さい。指定方法は [数値][単位(K,M,G)] です。
#---------------------------------------------------------------------------
BUILD_JAVADOC_HEAP=


#---------------------------------------------------------------------------
#  JAVADOC_WINDOWTITLE
#    JavaDoc ウィンドウタイトル
#
#    必ず""で囲んでください。
#---------------------------------------------------------------------------
JAVADOC_WINDOWTITLE=


#---------------------------------------------------------------------------
#  JAVADOC_TITLE
#    JavaDocタイトル
#
#    HTMLで記述します。半角空白は&nbsp;です。
#    必ず""で囲んでください。
#---------------------------------------------------------------------------
JAVADOC_TITLE=


#---------------------------------------------------------------------------
#  JAVADOC_HEADER
#    JavaDocヘッダ
#
#    HTMLで記述します。フッタにも使用します。
#    必ず""で囲んでください。
#---------------------------------------------------------------------------
JAVADOC_HEADER=


#---------------------------------------------------------------------------
#  SUBMODULE_ID_LIST
#    サブモジュールIDリスト（半角空白区切り）
#---------------------------------------------------------------------------
SUBMODULE_ID_LIST=


#---------------------------------------------------------------------------
#  SUBMODULE_ID
#    ビルド対象サブモジュールID（半角空白区切り）
#
#    並び順にJarファイルを作成します。
#    作成されたJarは、以降のビルドのクラスパスに含まれます。
#    サブモジュールIDが指定されていない場合はJarファイルは作成しません。
#---------------------------------------------------------------------------
SUBMODULE_ID=


#---------------------------------------------------------------------------
#  BUILD_DIRS
#    ビルド対象のソースDIR
#    ";"区切りで複数指定出来できます。
#    指定ディレクトリ以下全てがBUILD_SOURCEにコピーされます。
#---------------------------------------------------------------------------
BUILD_DIRS=




#===========================================================================
#  コンパイルクラスパス設定
#===========================================================================
#---------------------------------------------------------------------------
#  COMMON_EXT
#    COMMONコンパイル用追加クラスパス（Framework JARは含まない）
#---------------------------------------------------------------------------
COMMON_EXT=


#---------------------------------------------------------------------------
#  SERVER_EXT
#    SERVERコンパイル用追加クラスパス（Framework JARとCOMMON_EXTは含まない）
#---------------------------------------------------------------------------
SERVER_EXT=


#---------------------------------------------------------------------------
#  CLIENT_EXT
#    CLIENTコンパイル用追加クラスパス（Framework JARとCOMMON_EXTは含まない）
#---------------------------------------------------------------------------
CLIENT_EXT=




