##  SCa 用 環境設定ファイル
##
##	・各行の「#」以降はコメント
##	・変数の値の指定における特殊記述：
##		${変数名} : 他の変数を参照（参照される側を先に記述する）
##		$$        : プロセスＮｏ
##	・INI ファイルによる指定より，ＯＳレベルで設定された環境変数が
##	  優先する

[SCA]
#####  for dbutil only  #####
# Initial SQL for each Sessions
DB_INITIAL_SQL=begin MGPA_SCA.P_SCA0('${SCA_CO}','${SCA_USER}','${SCA_CALC_GRP_CD}','${SCA_CALC_NO}',:rc) ; MGPA_SCA.P_SCA1('${SCA_CALC_GRP_CD}','${SCA_CALC_NO}',:rc) ; end ;
DB_INITIAL_SQL_POS=call mgpa_sca$p_sca0('${SCA_CO}','${SCA_USER}','${SCA_CALC_GRP_CD}','${SCA_CALC_NO}',0) ; call mgpa_sca$p_sca1('${SCA_CALC_GRP_CD}','${SCA_CALC_NO}',0) ;

DB_COMMIT_CYCLE=T

# THREAD
DBUTIL_THREAD = 

#####  for dbutil & sca  #####
# Message file
MSG_FILE=

# Directories for input/output data
DATA_DIR=
OUT_DIR =

# Log file
LOG_FILE=
LOG_TIME=1
LOG_DEBUG=

# Data File Features
DBFILE_DELM = 
DBFILE_COMM = 
DBFILE_ESC  = 

#####  for sca only  #####
# Switch to activate optional funcitions
SCA_OPTION = 1-4

# Files to be skipped for input/output
SCA_SKPIN =
SCA_SKPOUT=

# Number of threads
SCA_THREAD = 

SCA_THREAD_ALC = 

# Parameters to control process abortion in reading data
SCA_ERR_LIMIT=
SCA_LOGMSG_MAX=1000

# Parameters to save input data at temporary files
#SCA_IDF_DIR=${SCA_DATA_HOME}/df_in
SCA_IDF_LIMIT=
SCA_IDF_ITEMS=

# Parameters to save alc data at temporary files
#SCA_ALC_DIR=${SCA_DATA_HOME}/df_alc
SCA_ALC_LIMIT=

# Parameters to save inpt data at temporary files
#SCA_INPT_DIR=${SCA_DATA_HOME}/df_inpt
SCA_INPT_LIMIT=
