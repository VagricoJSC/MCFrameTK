##  MRPea 用 環境設定ファイル
##
##	・各行の「#」以降はコメント
##	・変数の値の指定における特殊記述：
##		${変数名} : 他の変数を参照（参照される側を先に記述する）
##		$$        : プロセスＮｏ
##	・INI ファイルによる指定より，ＯＳレベルで設定された環境変数が
##	  優先する

[MRPEA]
#####  for dbutil only  #####
# Database environments
ORA_DB_HOST	=	# MRPea.bat で指定
ORA_DB_PORT	=	# MRPea.bat で指定
ORA_DB_SID	=	# MRPea.bat で指定
ORA_DB_USER	=	# MRPea.bat で指定
ORA_DB_PASSWD	=	# MRPea.bat で指定

POS_DB_HOST	=	# MRPea.bat で指定
POS_DB_PORT	=	# MRPea.bat で指定
POS_DB_NAME	=	# MRPea.bat で指定
POS_DB_SCHEMA	=	# MRPea.bat で指定
POS_DB_USER	=	# MRPea.bat で指定
POS_DB_PASSWD	=	# MRPea.bat で指定

# Number of threads
DBUTIL_THREAD	= 

# Initial SQL for each Oracle Sessions
DB_INITIAL_SQL	= begin MSPA_MRPEA.P_MRPEA0('${PROC_CO}','${PROC_USR}','${PROC_SCREEN_ID}','${PROC_SRV_REQ_NO}','${WG_CD}','${PROC_TYP}','${PROC_CNT}','${SIM_MRP_NO}', '${SIM_TYP}') ; end ;
DB_INITIAL_SQL_POS	= call mspa_mrpea$p_mrpea0('${PROC_CO}','${PROC_USR}','${PROC_SCREEN_ID}','${PROC_SRV_REQ_NO}','${WG_CD}','${PROC_TYP}','${PROC_CNT}','${SIM_MRP_NO}', '${SIM_TYP}') ;

# Data fetch features
DB_VAR_LEN	=
DB_BUFF_SIZE	=


#####  for dbutil & mrp  #####
# Message file
MSG_FILE	=	# MRPea.bat で指定

# Log file
LOG_FILE	=	# MRPea.bat で指定
LOG_TIME	= 1
LOG_DEBUG	= 

# Data file features
DBFILE_DELM	= 
DBFILE_COMM	= 
DBFILE_ESC	= 


#####  for mrp only  #####
# Files to be skipped for input/output
MRPEA_SKPIN 	=	# MRPea.sql で指定
MRPEA_SKPOUT	=	# MRPea.sql で指定

# Counter-group code used in issuing new ID
MRPEA_CNT_RQMT	=	# MRPea.sql で指定
MRPEA_CNT_ODR	=	# MRPea.sql で指定
MRPEA_CNT_KODR	=	# MRPea.sql で指定
MRPEA_CNT_SLIP	=	# MRPea.sql で指定

# Counter modifier used in issuing new ID
MRPEA_PFX_RQMT	=	# MRPea.sql で指定
MRPEA_PFX_ODR	=	# MRPea.sql で指定
MRPEA_PFX_KODR	=	# MRPea.sql で指定
MRPEA_PFX_SLIP	=	# MRPea.sql で指定

# Switch to activate optional funcitions
MRPEA_OPTION	= 1

# Number of threads
MRPEA_THREAD	=
MRPEA_THREAD_READ	=
# Number of items handled with a process each threads
MRPEA_GRAN_ITEM	=
# Number of issueing range with a process each threds
MRPEA_GRAN_ISSUE	=

# Value for null for nstring type
MRPEA_NULL_VAL	=	# MPRea.sql で指定

# Number precision
MRPEA_PREC	=

# Name of standard calendar
MRPEA_STDCAL	=

# Parameters to control rules on allotment
MRPEA_B_PRI	=
MRPEA_G_PRI	=
MRPEA_PREFER_LOC	=
MRPEA_PREFER_FIFO	=
MRPEA_PREFER_EXPIRE	=
MRPEA_PREFER_GRP	=
MRPEA_PREFER_LG	=
MRPEA_PREFER_ARRG	=
MRPEA_BASE_DT	= # MPRea.sql で指定
MRPEA_ALLOC_PAST	= 2
MRPEA_ALLOC_MARGIN	= 

MRPEA_XFER_DIFFLOC	= 1

# Parameters to control rules on new order generation
MRPEA_HINMOS_LOC	=
MRPEA_HINMOS_ARRG	=
MRPEA_RIGID_UNITE	=
MRPEA_HINMOS_BASE	= 1
MRPEA_NO_PURC_DT_FWD	=
 
# Parameters to control creating xfer order
MRPEA_DELXFER	=
MRPEA_SEPXFER	=
MRPEA_XFR_FIXTERM	=

# Parameters to control bom expansion
MRPEA_BOM_BASE	= 1

# Parameters to control process abortion
MRPEA_MAXODR	=
MRPEA_ERR_LIMIT	=

# Initial sequence-No for t_mrplog
MRPEA_LOGSEQ	=
# Max byte length of the message file
MRPEA_LOGMSG_MAX	=
